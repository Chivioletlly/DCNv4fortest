[project]
name = "general-decomp"
version = "0.1.0"
description = "General Degradation Decomposition Network"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "GeneralDecomp Team" }
]

dependencies = [
    "torch==2.5.1",
    "torchvision==0.20.1",
    "einops>=0.7.0",
    "pillow>=9.0.0",
    "tqdm>=4.65.0",
    "tensorboard>=2.14.0",
    "ipykernel>=6.29.5",
    "matplotlib>=3.7.5",
    "ninja>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]

[tool.ruff]
line-length = 100
target-version = "py38"
select = ["E", "F", "I", "N", "W"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
